name: CI

on:
  push:
    branches: [ main, swift-agent ]
  pull_request:
    branches: [ main, swift-agent ]

jobs:
  build-and-test:
    runs-on: macos-26  # macOS 26 (Tahoe) with Swift 6.2.3
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Docs consistency check
      run: ./scripts/check-docs-consistency.sh
      
    - name: Verify Swift Version
      run: swift --version
      
    - name: Cache Swift packages
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Build
      run: swift build --build-tests
      
    - name: Run tests
      run: swift test --parallel
      
    - name: Build release binary
      run: swift build -c release
      
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nanoclaw-agent
        path: .build/release/nanoclaw-agent

  build-static-linux:
    runs-on: macos-26
    needs: build-and-test
    env:
      NANOCLAW_DEVCTL_SWIFT_SDK: swift-6.2.3-RELEASE_static-linux-0.0.1
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Swift 6.2.3
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: '6.2.3'

    - name: Cache static Linux SDK
      uses: actions/cache@v4
      with:
        path: ~/Library/org.swift.swiftpm/swift-sdks
        key: ${{ runner.os }}-${{ runner.arch }}-swift-static-sdk-6.2.3

    - name: Install static Linux SDK
      run: |
        swift sdk list | grep -F "$NANOCLAW_DEVCTL_SWIFT_SDK" && exit 0
        swift sdk install \
          --checksum f30ec724d824ef43b5546e02ca06a8682dafab4b26a99fbb0e858c347e507a2c \
          https://download.swift.org/swift-6.2.3-release/static-sdk/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz

    - name: Build static Linux agent
      run: |
        SWIFT_BIN="$(command -v swift)"
        "$SWIFT_BIN" --version
        "$SWIFT_BIN" build -c release \
          --product nanoclaw-agent \
          --disable-automatic-resolution \
          --swift-sdk "$NANOCLAW_DEVCTL_SWIFT_SDK" \
          --triple aarch64-swift-linux-musl \
          --build-path .build/linux-static-sdk
        BIN_PATH="$(find .build/linux-static-sdk -type f -name nanoclaw-agent | head -1)"
        test -n "$BIN_PATH"
        cp "$BIN_PATH" .build/linux-output-nanoclaw-agent
        file .build/linux-output-nanoclaw-agent

    - name: Upload static Linux agent artifact
      uses: actions/upload-artifact@v4
      with:
        name: nanoclaw-agent-linux-static
        path: .build/linux-output-nanoclaw-agent

  container-build:
    runs-on: macos-26
    needs: build-static-linux

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download static Linux agent artifact
      uses: actions/download-artifact@v4
      with:
        name: nanoclaw-agent-linux-static
        path: .build

    - name: Verify downloaded binary
      run: |
        test -f .build/linux-output-nanoclaw-agent
        file .build/linux-output-nanoclaw-agent

    - name: Build container (slim)
      run: |
        CONTAINER_BIN="$(command -v container || true)"
        if [ -z "$CONTAINER_BIN" ] && [ -x /opt/homebrew/opt/container/bin/container ]; then
          CONTAINER_BIN=/opt/homebrew/opt/container/bin/container
        fi
        test -n "$CONTAINER_BIN"
        "$CONTAINER_BIN" build -f container/Dockerfile.slim -t nanoclawswift-agent:slim .

    - name: Test container runtime smoke checks
      run: |
        container system start || true
        CONTAINER_IMAGE=nanoclawswift-agent:slim ./scripts/container-smoke.sh
