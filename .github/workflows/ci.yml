name: CI

on:
  push:
    branches: [ main, swift-agent ]
  pull_request:
    branches: [ main, swift-agent ]

jobs:
  build-and-test:
    runs-on: macos-26  # macOS 26 (Tahoe) with Swift 6.2.3
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Docs consistency check
      run: ./scripts/check-docs-consistency.sh
      
    - name: Verify Swift Version
      run: swift --version
      
    - name: Cache Swift packages
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Build
      run: swift build --build-tests
      
    - name: Run tests
      run: swift test --parallel
      
    - name: Build release binary
      run: swift build -c release
      
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nanoclaw-agent
        path: .build/release/nanoclaw-agent

  container-build:
    runs-on: ubuntu-22.04
    needs: build-and-test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Swift
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: '6.2.4'

    - name: Cache Swift packages
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-container-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-container-

    - name: Build Linux agent for container
      run: |
        swift build -c release --product nanoclaw-agent
        cp .build/release/nanoclaw-agent .build/linux-output-nanoclaw-agent
        file .build/linux-output-nanoclaw-agent

    - name: Build container (slim)
      run: |
        docker build -f container/Dockerfile.slim -t nanoclawswift-agent:slim .

    - name: Test container runtime smoke checks
      run: |
        docker image inspect nanoclawswift-agent:slim >/dev/null
        docker run --rm --entrypoint /bin/sh nanoclawswift-agent:slim -lc 'test -x /app/nanoclaw-agent'
