name: CI

on:
  push:
    branches: [ main, swift-agent ]
  pull_request:
    branches: [ main, swift-agent ]

jobs:
  build-and-test:
    runs-on: macos-26  # macOS 26 (Tahoe) with Swift 6.2.3
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Swift
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: '6.2.4'

    - name: Docs consistency check
      run: ./scripts/check-docs-consistency.sh
      
    - name: Verify Swift Version
      run: swift --version
      
    - name: Cache Swift packages
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Build
      run: swift build --build-tests
      
    - name: Run tests
      run: swift test --parallel
      
    - name: Build release binary
      run: swift build -c release
      
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nanoclaw-agent
        path: .build/release/nanoclaw-agent
        
  container-build:
    if: ${{ vars.NANOCLAW_ENABLE_APPLE_CONTAINER_CI == 'true' }} # On hold pending non-interactive kernel bootstrap or self-hosted Apple silicon runner.
    runs-on: macos-26
    needs: build-and-test
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Apple container CLI
      env:
        APPLE_CONTAINER_VERSION: 0.10.0
        APPLE_CONTAINER_PKG_URL: https://github.com/apple/container/releases/download/0.10.0/container-0.10.0-installer-signed.pkg
        APPLE_CONTAINER_PKG_SHA256: c481ce355524d036c3cddac7fd281e31794d40690bf9a21f732ef3d76fa9fe08
      run: |
        set -euo pipefail
        PKG_PATH="$RUNNER_TEMP/container-${APPLE_CONTAINER_VERSION}-installer-signed.pkg"
        curl -L --fail --output "$PKG_PATH" "$APPLE_CONTAINER_PKG_URL"
        echo "${APPLE_CONTAINER_PKG_SHA256}  $PKG_PATH" | shasum -a 256 --check
        sudo installer -pkg "$PKG_PATH" -target /
        echo "/usr/local/bin" >> "$GITHUB_PATH"
        /usr/local/bin/container --version
        /usr/local/bin/container system start

    - name: Setup Swift
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: '6.2.4'

    - name: Cache Swift static SDKs
      uses: actions/cache@v4
      with:
        path: ~/Library/org.swift.swiftpm/swift-sdks
        key: ${{ runner.os }}-swift-static-sdk-6.2.4-0.1.0

    - name: Install Swift static Linux SDK
      env:
        NANOCLAW_SWIFT_TOOLCHAIN_BIN: /Users/runner/Library/Developer/Toolchains/swift-6.2.4-RELEASE.xctoolchain/usr/bin/swift
        NANOCLAW_STATIC_SDK_ID: swift-6.2.4-RELEASE_static-linux-0.1.0
        NANOCLAW_STATIC_SDK_URL: https://download.swift.org/swift-6.2.4-release/static-sdk/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
        NANOCLAW_STATIC_SDK_CHECKSUM: 24bdf84495dd31a6de2eb679647c1982b747bfbfe1a2060c779d84dcecd902a4
      run: |
        set -euo pipefail
        SDK_ROOT="$HOME/Library/org.swift.swiftpm/swift-sdks/${NANOCLAW_STATIC_SDK_ID}.artifactbundle"
        if [ ! -d "$SDK_ROOT" ]; then
          swift sdk install "$NANOCLAW_STATIC_SDK_URL" --checksum "$NANOCLAW_STATIC_SDK_CHECKSUM"
        fi
        if [ ! -x "$NANOCLAW_SWIFT_TOOLCHAIN_BIN" ]; then
          echo "Expected Swift toolchain binary not found at $NANOCLAW_SWIFT_TOOLCHAIN_BIN" >&2
          exit 1
        fi
        echo "NANOCLAW_DEVCTL_SWIFT_BIN=$NANOCLAW_SWIFT_TOOLCHAIN_BIN" >> "$GITHUB_ENV"
        echo "NANOCLAW_DEVCTL_SWIFT_SDK=$NANOCLAW_STATIC_SDK_ID" >> "$GITHUB_ENV"
        swift sdk list
      
    - name: Build container (slim)
      run: swift run nanoclaw-devctl build-agent-image slim
        
    - name: Test container runtime smoke checks
      run: |
        container system start || true
        CONTAINER_IMAGE=nanoclawswift-agent:slim ./scripts/container-smoke.sh
