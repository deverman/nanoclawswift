name: CI

on:
  push:
    branches: [ main, swift-agent ]
  pull_request:
    branches: [ main, swift-agent ]

jobs:
  build-and-test:
    runs-on: macos-26  # macOS 26 (Tahoe) with Swift 6.2.3
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Docs consistency check
      run: ./scripts/check-docs-consistency.sh
      
    - name: Verify Swift Version
      run: swift --version
      
    - name: Cache Swift packages
      uses: actions/cache@v3
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve dependencies
      run: swift package resolve
      
    - name: Build
      run: swift build --build-tests
      
    - name: Run tests
      run: swift test --parallel
      
    - name: Build release binary
      run: swift build -c release
      
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nanoclaw-agent
        path: .build/release/nanoclaw-agent
        
  container-build:
    runs-on: macos-26
    needs: build-and-test
    env:
      NANOCLAW_DEVCTL_SWIFT_SDK: swift-6.2.3-RELEASE_static-linux-0.0.1
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Swift 6.2.3 for static SDK build
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: '6.2.3'

    - name: Cache static Linux SDK
      uses: actions/cache@v4
      with:
        path: ~/Library/org.swift.swiftpm/swift-sdks
        key: ${{ runner.os }}-${{ runner.arch }}-swift-static-sdk-6.2.3

    - name: Install static Linux SDK
      run: |
        swift sdk list | grep -F "$NANOCLAW_DEVCTL_SWIFT_SDK" && exit 0
        swift sdk install \
          --checksum f30ec724d824ef43b5546e02ca06a8682dafab4b26a99fbb0e858c347e507a2c \
          https://download.swift.org/swift-6.2.3-release/static-sdk/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz
      
    - name: Build container (slim)
      run: swift run nanoclaw-devctl build-agent-image slim
        
    - name: Test container runtime smoke checks
      run: |
        container system start || true
        CONTAINER_IMAGE=nanoclawswift-agent:slim ./scripts/container-smoke.sh
